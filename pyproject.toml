[project]
name = "tpae"
version = "0.1.0"
description = "Terrestrial Protected Area Effectiveness"
authors = [
    {name = "SkyTruth"}
]
license = {text = "Apache License, Version 2.0"}
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "earthengine-api>=1.7.4",
    "geopandas (>=1.1.3,<2.0.0)",
    "hvplot (>=0.12.2,<0.13.0)",
    "xarray (>=2026.2.0,<2027.0.0)",
    "rioxarray (>=0.22.0,<0.23.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.17.1,<2.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "geemap (>=0.36.6,<0.37.0)",
    "ruff (>=0.15.0)",
    "pre-commit (>=4.5.1)"
]
